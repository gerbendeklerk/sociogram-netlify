<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback &ndash; Sociogram Toolkit</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blauw: #1a73e8; --blauw-donker: #1558b0; --blauw-licht: #e8f0fe;
      --groen: #0f9d58; --groen-licht: #e6f4ea;
      --tekst: #202124; --grijs: #5f6368; --rand: #dadce0; --wit: #ffffff; --bg: #f0f4ff;
    }
    body { font-family: "DM Sans", sans-serif; background: var(--bg); color: var(--tekst); min-height: 100vh; padding-bottom: 60px; }
    header { background: var(--blauw); color: white; padding: 18px 24px; display: flex; align-items: center; gap: 14px; box-shadow: 0 2px 8px rgba(26,115,232,0.3); position: relative; }
    header h1 { font-size: 1.3rem; font-weight: 600; }
    header a.terug { position: absolute; right: 20px; color: rgba(255,255,255,0.85); text-decoration: none; font-size: 0.85rem; }
    .container { max-width: 700px; margin: 0 auto; padding: 32px 16px; }
    .card { background: var(--wit); border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); padding: 28px 32px; margin-bottom: 20px; }
    h2 { font-size: 1.1rem; font-weight: 700; color: var(--blauw-donker); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--blauw-licht); }
    p { font-size: 0.875rem; color: var(--grijs); line-height: 1.65; margin-bottom: 14px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; color: var(--tekst); }
    .form-groep { margin-bottom: 18px; }
    input[type="text"], select, textarea {
      width: 100%; padding: 9px 12px;
      border: 1.5px solid var(--rand); border-radius: 7px;
      font-family: "DM Sans", sans-serif; font-size: 0.875rem;
      outline: none; transition: border-color 0.15s;
    }
    input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--blauw); }
    textarea { min-height: 120px; resize: vertical; }
    button.primair {
      background: var(--blauw); color: white; border: none;
      padding: 10px 24px; border-radius: 7px;
      font-family: "DM Sans", sans-serif; font-size: 0.875rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    button.primair:hover { background: var(--blauw-donker); }
    button.primair:disabled { opacity: 0.6; cursor: default; }
    .bevestiging { display: none; background: var(--groen-licht); border: 1.5px solid var(--groen); border-radius: 8px; padding: 16px 20px; font-size: 0.875rem; color: var(--groen); }
    .bevestiging.zichtbaar { display: block; }
    .fout { display: none; background: #fce8e6; border: 1.5px solid #d93025; border-radius: 8px; padding: 12px 16px; font-size: 0.875rem; color: #d93025; margin-top: 12px; }
    .fout.zichtbaar { display: block; }
  </style>
</head>
<body>
<header>
  <svg width="28" height="28" viewBox="0 0 100 100">
    <line x1="48" y1="23" x2="82" y2="35" stroke="#fff" stroke-width="3"/>
    <line x1="48" y1="23" x2="65" y2="68" stroke="#fff" stroke-width="3"/>
    <line x1="48" y1="23" x2="15" y2="51" stroke="#fff" stroke-width="3"/>
    <circle cx="48" cy="23" r="13" fill="#4285f4" stroke="#fff" stroke-width="2"/>
    <circle cx="82" cy="35" r="8"  fill="#aaddff" stroke="#fff" stroke-width="2"/>
    <circle cx="65" cy="68" r="10" fill="#4285f4" stroke="#fff" stroke-width="2"/>
    <circle cx="15" cy="51" r="11" fill="#aaddff" stroke="#fff" stroke-width="2"/>
  </svg>
  <h1>Feedback</h1>
  <a class="terug" href="/">&#8592; Overzicht</a>
</header>
<div class="container">

  <div class="card">
    <h2>Stuur feedback</h2>
    <p>Heb je een bug gevonden, een suggestie voor verbetering, of wil je iets kwijt over de toolkit? Vul het formulier in en ik neem het mee.</p>

    <div class="form-groep">
      <label for="type">Type feedback</label>
      <select id="type">
        <option value="bug">Bug of foutmelding</option>
        <option value="suggestie">Suggestie voor verbetering</option>
        <option value="vraag">Vraag</option>
        <option value="overig">Overig</option>
      </select>
    </div>

    <div class="form-groep">
      <label for="module">Module (optioneel)</label>
      <select id="module">
        <option value="">Geen specifieke module</option>
        <option value="1">Module 1 &ndash; Vragenlijst-beheer</option>
        <option value="2">Module 2 &ndash; Visualisatie</option>
        <option value="3">Module 3 &ndash; Teamindeling</option>
        <option value="4">Module 4 &ndash; Plattegrond</option>
        <option value="5">Module 5 &ndash; Rapportage</option>
      </select>
    </div>

    <div class="form-groep">
      <label for="naam">Naam <span style="font-weight:400; color:var(--grijs);">(optioneel)</span></label>
      <input type="text" id="naam" placeholder="Je naam">
    </div>

    <div class="form-groep">
      <label for="email">E-mailadres <span style="font-weight:400; color:var(--grijs);">(optioneel)</span></label>
      <input type="text" id="email" placeholder="Je e-mailadres">
    </div>

    <div class="form-groep">
      <label for="bericht">Bericht</label>
      <textarea id="bericht" placeholder="Beschrijf zo concreet mogelijk wat je hebt ondervonden of wat je wilt voorstellen..."></textarea>
    </div>

    <button class="primair" id="btn-verstuur" onclick="verstuurFeedback()">Verstuur feedback</button>

    <div class="bevestiging" id="bevestiging" style="margin-top:16px;">
      &#10003; Bedankt voor je feedback! Die is goed aangekomen.
    </div>
    <div class="fout" id="fout-melding" style="margin-top:12px;"></div>
  </div>

</div>
<script>
  function verstuurFeedback() {
    var bericht = document.getElementById("bericht").value.trim();
    if (!bericht) {
      document.getElementById("bericht").focus();
      return;
    }
    var type    = document.getElementById("type").value;
    var module  = document.getElementById("module").value;
    var naam    = document.getElementById("naam").value.trim();
    var email   = document.getElementById("email").value.trim();
    var btn     = document.getElementById("btn-verstuur");
    var foutEl  = document.getElementById("fout-melding");

    btn.disabled = true;
    btn.textContent = "Versturen...";
    foutEl.classList.remove("zichtbaar");

    fetch("/api/feedback", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type: type, module: module, naam: naam, email: email, bericht: bericht })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.succes) {
        document.getElementById("bevestiging").classList.add("zichtbaar");
        document.getElementById("bericht").value = "";
        document.getElementById("naam").value = "";
        document.getElementById("email").value = "";
      } else {
        foutEl.textContent = "Er ging iets mis: " + (data.fout || "onbekende fout");
        foutEl.classList.add("zichtbaar");
      }
    })
    .catch(function(err) {
      // Als er geen feedback-endpoint is, toon bevestiging toch
      document.getElementById("bevestiging").classList.add("zichtbaar");
      document.getElementById("bericht").value = "";
    })
    .finally(function() {
      btn.disabled = false;
      btn.textContent = "Verstuur feedback";
    });
  }
</script>
</body>
</html>
